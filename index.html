<!doctype html>
<!--
  Landing page for the Supabase Auth "Site URL", which exists here only to
  prefix the OAuth consent path (/oauth/consent). Accounts, invites and
  passwords are all handled in the iOS app (invite and reset emails carry a
  code you type into the app), so nothing should normally send people here.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Trip Planner</title>
  <style>
    :root { --bone: #f6f4f0; --ink: #1a1a18; --ink-light: #6b6963; }
    @media (prefers-color-scheme: dark) { :root { --bone: #161614; --ink: #f2efe8; --ink-light: #b5b1a8; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
           background: var(--bone); color: var(--ink);
           font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; text-align: center; }
    h1 { font-family: "New York", Georgia, serif; font-weight: 500; }
    p { color: var(--ink-light); max-width: 340px; }
  </style>
</head>
<body>
  <div>
    <h1>Trip Planner</h1>
    <p>Trip Planner lives in the app on your iPhone. Looking to use it with Claude?
      See <a href="/claude/">the setup guide</a>.</p>
  </div>
</body>
</html>
