<!doctype html>
<!--
  Landing page for the Supabase Auth "Site URL". Besides prefixing the OAuth
  consent path, the Site URL is where confirmation and password-reset emails
  send people, so it should be a page that makes sense to land on.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trip Planner</title>
  <style>
    :root { --bone: #f6f4f0; --ink: #1a1a18; --ink-light: #6b6963; }
    @media (prefers-color-scheme: dark) { :root { --bone: #161614; --ink: #f2efe8; --ink-light: #b5b1a8; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
           background: var(--bone); color: var(--ink);
           font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; text-align: center; }
    h1 { font-family: "New York", Georgia, serif; font-weight: 500; }
    p { color: var(--ink-light); max-width: 340px; }
  </style>
</head>
<body>
  <div>
    <h1>Trip Planner</h1>
    <p>You're all set. Head back to the Trip Planner app on your iPhone to continue.</p>
  </div>
</body>
</html>
